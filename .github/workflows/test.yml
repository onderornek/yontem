name: Testler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: JavaScript derleyicisi (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Kur ve derle
        working-directory: js
        run: npm ci && npm run build
      - name: Dil testleri ve örnekler
        working-directory: js
        run: npm test
      - name: Dil sunucusu (LSP)
        working-directory: js
        run: npm run test:dil
      - name: Hata ayıklayıcı (uçbirim ve DAP)
        working-directory: js
        run: npm run test:ayikla
      - name: Sunucu birimi (yerel portlarda, JavaScript ve Python)
        working-directory: js
        run: npm run test:sunucu
      - name: Veritabanı birimi (SQLite)
        working-directory: js
        run: npm run test:vt
      - name: Katı kip (derleme zamanı tip denetimi)
        working-directory: js
        run: npm run test:kati
      - name: Paket yöneticisi (yerel sınama sunucusuyla)
        working-directory: js
        run: npm run test:paket
      - name: Ağ birimi (yerel sınama sunucusuyla, JavaScript ve Python)
        working-directory: js
        run: npm run test:ag
      - name: Yerel asistan örnekleri (sahte model servisiyle, JavaScript ve Python)
        working-directory: js
        run: node betikler/asistan_testi.js
      - name: Gömülü arka uç (C++ masaüstü benzetimi)
        if: matrix.node == 24
        working-directory: js
        run: npm run test:gomulu

  python:
    name: Python yorumlayıcısı (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Dil testleri ve örnekler
        run: python3 testler/calistir.py
      - name: pip ile kurulum
        run: |
          pip install .
          cd "$RUNNER_TEMP" && yontem-py --surum
