name: Sürüm yayımla

# js/package.json içindeki sürüm numarası değiştiğinde (ya da elle başlatıldığında):
#   1. O sürüm npm'de yoksa testleri çalıştırır ve paketi npm'e ONAY BEKLEYEN sürüm olarak gönderir
#      (npm stage publish). Sürüm, bakımcı npmjs.com'da iki adımlı doğrulamayla onaylayınca yayımlanır.
# Her gün bir kez (ve yukarıdaki durumlarda):
#   2. Sürüm npm'de yayımlanmışsa ve GitHub'da "v<sürüm>" kaydı yoksa, CHANGELOG'daki bölümle oluşturur.
# Aynı sürüm iki kez gönderilmez; yapılacak bir şey yoksa iş akışı hiçbir şey değiştirmez.
#
# npm'e giriş için saklanan bir belirteç kullanılmaz. npmjs.com'daki ayar (bir kez):
#   yontem paketi → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: onderornek · Repository: yontem · Workflow filename: yayimla.yml
#   İzin: npm stage publish

on:
  push:
    branches: [main]
    paths: ['js/package.json']
  schedule:
    - cron: '23 5 * * *'      # onaylanan sürümün GitHub kaydını oluşturmak için günlük denetim (UTC)
  workflow_dispatch:

permissions:
  contents: write      # etiket ve sürüm kaydı oluşturmak için
  id-token: write      # npm'e güvenilir yayımcı (OIDC) olarak giriş için

concurrency:
  group: yayimla
  cancel-in-progress: false

jobs:
  yayimla:
    name: npm ve GitHub sürümü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Durumu belirle
        id: durum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          surum=$(node -p "require('./js/package.json').version")
          py=$(python3 -c "import re; print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "surum=$surum" >> "$GITHUB_OUTPUT"
          if [ "$surum" != "$py" ]; then echo "::error::js/package.json ($surum) ile pyproject.toml ($py) sürümleri farklı"; exit 1; fi
          if ! grep -q "^## $surum " CHANGELOG.md; then echo "::error::CHANGELOG.md içinde $surum bölümü yok"; exit 1; fi
          if npm view "yontem@$surum" version >/dev/null 2>&1; then echo "npm=var" >> "$GITHUB_OUTPUT"; else echo "npm=yok" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$surum" >/dev/null 2>&1; then echo "etiket=var" >> "$GITHUB_OUTPUT"; else echo "etiket=yok" >> "$GITHUB_OUTPUT"; fi
          echo "Sürüm $surum · npm: $(grep '^npm=' "$GITHUB_OUTPUT" | cut -d= -f2) · GitHub sürümü: $(grep '^etiket=' "$GITHUB_OUTPUT" | cut -d= -f2)" >> "$GITHUB_STEP_SUMMARY"

      - name: Kur, derle ve sına
        if: steps.durum.outputs.npm == 'yok' && github.event_name != 'schedule'
        working-directory: js
        run: |
          npm ci
          npm run build
          npm test
          npm run test:dil
          npm run test:kati
          npm run test:paket
          python3 ../testler/calistir.py

      - name: npm'e onay bekleyen sürüm olarak gönder
        if: steps.durum.outputs.npm == 'yok' && github.event_name != 'schedule'
        working-directory: js
        run: |
          npm install -g npm@latest      # güvenilir yayımcı girişi ve 'npm stage' güncel npm ister
          npm stage publish
          echo "Sürüm npm'e gönderildi ve onay bekliyor: npmjs.com → yontem → onay bekleyen sürümler." >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub sürümünü oluştur
        if: steps.durum.outputs.npm == 'var' && steps.durum.outputs.etiket == 'yok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          surum=${{ steps.durum.outputs.surum }}
          # etiket, sürüm numarasını bu değere getiren değişikliği gösterir
          hedef=$(git log -1 --format=%H -S"\"version\": \"$surum\"" -- js/package.json)
          awk -v s="$surum" '/^## /{yaz = ($2 == s)} yaz && !/^## /' CHANGELOG.md > notlar.md
          gh release create "v$surum" --target "${hedef:-$GITHUB_SHA}" --title "Yöntem $surum" --notes-file notlar.md
